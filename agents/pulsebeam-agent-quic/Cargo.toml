[package]
name = "pulsebeam-agent-quic"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes.workspace = true
noq-proto = { version = "=1.4.0", default-features = false, features = ["rustls", "aws-lc-rs"] }
pulsebeam-agent-core = { path = "../pulsebeam-agent-core", optional = true }
pulsebeam-core = { path = "../../crates/pulsebeam-core" }
pulsebeam-proto = { path = "../../crates/pulsebeam-proto" }
pulsebeam-udp = { path = "../../crates/pulsebeam-udp" }
reqwest = { version = "0.13.4", optional = true }
tokio = { workspace = true, optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }

[dev-dependencies]
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "aws_lc_rs"] }
tokio.workspace = true

[features]
executor = ["dep:pulsebeam-agent-core", "dep:reqwest", "dep:tokio"]
sim = ["pulsebeam-udp/sim"]
portable-scalar = ["pulsebeam-udp/portable-scalar"]

[lints]
workspace = true
