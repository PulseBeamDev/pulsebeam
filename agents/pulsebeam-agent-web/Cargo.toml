[package]
name = "pulsebeam-agent-web"
version = "0.1.0"
edition = "2024"
description = "Browser host runtime for the PulseBeam SANS-I/O agent"
license.workspace = true
repository.workspace = true

[features]
browser-tests = []
uniffi = []

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
agent_core = { package = "pulsebeam-agent-core", version = "0.1.0", path = "../pulsebeam-agent-core" }
js-sys = "0.3.104"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
thiserror.workspace = true
uniffi = { version = "=0.31.0", default-features = false, features = ["wasm-unstable-single-threaded"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.104", features = [
  "AbortController",
  "AbortSignal",
  "BinaryType",
  "Event",
  "Headers",
  "MessageEvent",
  "MediaStream",
  "MediaStreamTrack",
  "Request",
  "RequestInit",
  "Response",
  "RtcBundlePolicy",
  "RtcConfiguration",
  "RtcDataChannel",
  "RtcDataChannelInit",
  "RtcDataChannelState",
  "RtcDataChannelType",
  "RtcPeerConnection",
  "RtcPeerConnectionState",
  "RtcRtpParameters",
  "RtcRtpReceiver",
  "RtcRtpSender",
  "RtcRtpTransceiver",
  "RtcRtpTransceiverDirection",
  "RtcRtpTransceiverInit",
  "RtcSdpType",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
  "RtcTrackEvent",
  "Window",
  "console",
] }

[dev-dependencies]
serde_json = "1"
thirtyfour = { version = "0.37.5", default-features = false, features = ["bidi", "manager", "rustls"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread"] }

[[test]]
name = "browser"
path = "tests/browser.rs"
required-features = ["browser-tests"]

[lints]
workspace = true
