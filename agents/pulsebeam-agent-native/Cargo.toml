[package]
name = "pulsebeam-agent-native"
version.workspace = true
authors.workspace = true
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
bindgen = ["uniffi/cargo-metadata", "uniffi/cli"]
sim = ["pulsebeam-core/sim", "agent_core/sim"]

[dependencies]
agent_core = { package = "pulsebeam-agent-core", path = "../pulsebeam-agent-core" }
http = "1.4.1"
pulsebeam-core = { path = "../../crates/pulsebeam-core", features = ["reqwest"] }
pulsebeam-webrtc-sys.workspace = true
reqwest = "0.13.4"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uniffi = { version = "=0.31.0", default-features = false, features = ["tokio"] }

[lints]
workspace = true

[[bin]]
name = "pulsebeam-agent-native-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]
