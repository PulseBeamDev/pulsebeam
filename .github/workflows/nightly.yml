# Advisory and replayable seed search, never a merge gate.
name: Nightly seed sweep
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: How many seeds to run
        required: false
        default: '24'
      from:
        description: First seed
        required: false
        default: '1'
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
      - name: Sweep and retain replay commands
        shell: bash
        run: |
          set -o pipefail
          seeds='${{ github.event.inputs.seeds || '24' }}'
          from='${{ github.event.inputs.from }}'
          if [[ -z "$from" ]]; then
            from=$(( ${{ github.run_number }} * seeds + 1 ))
          fi
          ./bazel run //:sweep -- --seeds "$seeds" --from-seed "$from" 2>&1 | tee seed-sweep.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-sweep-evidence
          path: seed-sweep.log
