name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  # Separate from the test job on purpose: a lint failure and a test failure are
  # different problems, and the architectural rules (shared state, ambient
  # clock, blocking — see crates/pulsebeam/docs/thread-per-core.md) are the ones
  # most likely to be waved through if they only ever appear as a warning inside
  # a test log.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
        with:
          web: "true"

      - run: rustup component add clippy rustfmt

      - name: Check
        run: just check

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
        with:
          web: "true"

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests
        run: crates/pulsebeam-rtc/scripts/run-browser-matrix.sh --platform linux-x86_64 --include-root-tests

      - name: Upload RTC browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pulsebeam-rtc-browser-evidence
          path: target/pulsebeam-rtc-browser-artifacts
          if-no-files-found: error

  # eBPF attach/load needs elevated kernel privileges, which the normal `build`
  # job does not have and should not gain. Keep the behavioural smoke test in
  # its own job so capability failures remain distinct from build failures.
  ebpf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci

      - name: Install nightly for eBPF build-std
        run: rustup toolchain install nightly --component rust-src --profile minimal

      - name: Build and attach eBPF program
        run: just ebpf
