name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Separate from the test job on purpose: a lint failure and a test failure are
  # different problems, and the architectural rules (shared state, ambient
  # clock, blocking — see docs/thread-per-core.md) are the ones most likely to
  # be waved through if they only ever appear as a warning inside a test log.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - run: sudo apt-get install -y protobuf-compiler clang nasm pkg-config
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.10
    - run: rustup component add clippy rustfmt
    - name: Lint
      run: make lint-check
    - name: Formatting
      run: cargo fmt --all --check

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - run: sudo apt-get install -y protobuf-compiler clang nasm pkg-config
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.10
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest
    - name: Run tests
      run: make test
      env:
        CARGO_TERM_COLOR: always
