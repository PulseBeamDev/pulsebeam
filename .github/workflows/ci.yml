name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  # Separate from the test job on purpose: a lint failure and a test failure are
  # different problems, and the architectural rules (shared state, ambient
  # clock, blocking — see crates/pulsebeam/docs/thread-per-core.md) are the ones
  # most likely to be waved through if they only ever appear as a warning inside
  # a test log.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang nasm pkg-config

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - run: rustup component add clippy rustfmt

      - name: Check
        run: just check

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang nasm pkg-config

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run tests
        run: just test

  # eBPF attach/load needs elevated kernel privileges, which the normal `build`
  # job does not have and should not gain. Keep the behavioural smoke test in
  # its own job so capability failures remain distinct from build failures.
  ebpf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang nasm pkg-config

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install nightly for eBPF build-std
        run: rustup toolchain install nightly --component rust-src --profile minimal

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build and attach eBPF program
        run: just ebpf
