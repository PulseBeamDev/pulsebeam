name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  # Separate from the test job on purpose: a lint failure and a test failure are
  # different problems, and the architectural rules (shared state, ambient
  # clock, blocking — see docs/thread-per-core.md) are the ones most likely to
  # be waved through if they only ever appear as a warning inside a test log.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang nasm pkg-config

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - run: rustup component add clippy rustfmt

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lint
        run: make lint-check

  build:
    runs-on: ubuntu-latest

    outputs:
      has_ebpf: ${{ steps.layout.outputs.has_ebpf }}
      run_ebpf_smoke: ${{ steps.layout.outputs.run_ebpf_smoke }}

    steps:
      - uses: actions/checkout@v7

      - name: Detect repository layout
        id: layout
        shell: bash
        run: |
          if [[ -f pulsebeam-ebpf/Cargo.toml ]]; then
            echo "has_ebpf=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ebpf=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f pulsebeam-ebpf/Cargo.toml && -f pulsebeam/Cargo.toml ]]; then
            echo "run_ebpf_smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_ebpf_smoke=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang nasm pkg-config

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests
        run: make test

      - name: Test routing crate
        run: make test-routing

  browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang nasm pkg-config

      - name: Install Chromium
        run: |
          npm ci --prefix browser
          PLAYWRIGHT_BROWSERS_PATH=$GITHUB_WORKSPACE/browser/.playwright npx --prefix browser playwright install --with-deps chromium
          PLAYWRIGHT_BROWSERS_PATH=$GITHUB_WORKSPACE/browser/.playwright npx --prefix browser playwright install --only-shell chromium

      - name: Browser interoperability regression
        run: make test-browser

  # eBPF attach/load needs elevated kernel privileges, which the normal `build`
  # job does not have and should not gain. Keep the behavioural smoke test in
  # its own job so capability failures remain distinct from build failures.
  ebpf-smoke:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.run_ebpf_smoke == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang nasm pkg-config

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install nightly for eBPF build-std
        run: rustup toolchain install nightly --component rust-src --profile minimal

      - name: Build eBPF program
        run: make build-ebpf

      # The test is ignored in ordinary builds because it needs a real kernel
      # eBPF attach; this job is the privileged execution path.
      - name: Attach/load smoke test (privileged)
        run: >
          sudo env
          "PATH=$PATH"
          RUSTC_WRAPPER=
          SCCACHE_GHA_ENABLED=false
          cargo test
          -p pulsebeam
          --lib
          ebpf::tests::loader_attaches_to_a_reuseport_group
          --release
          --
          --ignored
          --test-threads=1
