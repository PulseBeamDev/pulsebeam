name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Separate from the test job on purpose: a lint failure and a test failure are
  # different problems, and the architectural rules (shared state, ambient
  # clock, blocking — see docs/thread-per-core.md) are the ones most likely to
  # be waved through if they only ever appear as a warning inside a test log.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - run: sudo apt-get install -y protobuf-compiler clang nasm pkg-config
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.10
    - run: rustup component add clippy rustfmt
    - name: Formatting
      run: cargo fmt --all --check
    - name: Lint
      run: make lint-check

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - run: sudo apt-get install -y protobuf-compiler clang nasm pkg-config
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.10
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest
    - name: Run tests
      run: make test
      env:
        CARGO_TERM_COLOR: always

    - name: Test routing crate
      run: make test-routing
      env:
        CARGO_TERM_COLOR: always
    # bpfel-unknown-none is tier 3: there is no prebuilt std for it, so the
    # eBPF crate always needs nightly's `-Z build-std=core`, not a target
    # rustup can install (see Makefile's build-ebpf).
    - name: Install nightly for eBPF build-std
      if: hashFiles('pulsebeam-ebpf/Cargo.toml') != ''
      run: rustup toolchain install nightly --component rust-src --profile minimal
    - name: Build eBPF program
      if: hashFiles('pulsebeam-ebpf/Cargo.toml') != ''
      run: make build-ebpf
      env:
        CARGO_TERM_COLOR: always

  agent-architecture:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - run: sudo apt-get install -y protobuf-compiler clang nasm pkg-config firefox-esr
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.10
    - run: rustup component add clippy rustfmt
    - run: rustup target add wasm32-unknown-unknown
    - name: Install matching WASM browser test runner
      run: cargo install wasm-bindgen-cli --version 0.2.108 --locked
    - name: Protected path guard
      run: make protected-paths
    - name: Additive crate checks
      run: make agent-check
      env:
        CARGO_TERM_COLOR: always
    - name: Additive crate tests
      run: make agent-test agent-conformance
      env:
        CARGO_TERM_COLOR: always
    - name: Additive crate clippy
      run: cargo clippy -p pulsebeam-agent-core -p pulsebeam-agent-native -p pulsebeam-agent-web --all-targets
      env:
        CARGO_TERM_COLOR: always
    - name: Core and web WASM checks
      run: make agent-wasm
      env:
        CARGO_TERM_COLOR: always
    - name: WASM size budget
      run: make agent-wasm-size
      env:
        CARGO_TERM_COLOR: always
    - name: Browser fixture
      run: make agent-browser-test
      env:
        CARGO_TERM_COLOR: always
    - name: Existing reference crate tests
      run: cargo test -p pulsebeam-agent
      env:
        CARGO_TERM_COLOR: always
    - name: Existing workspace unit tests
      run: make test-unit
      env:
        CARGO_TERM_COLOR: always
    - name: Existing simulation tests
      run: make test-sim
      env:
        CARGO_TERM_COLOR: always
    - name: Isolated native-agent simulation tests
      run: make test-sim-agent-native
      env:
        CARGO_TERM_COLOR: always
    - name: Workspace architectural lint
      run: make lint-check
      env:
        CARGO_TERM_COLOR: always
    - name: Protected path guard after validation
      run: make protected-paths

  # eBPF attach/load needs elevated kernel privileges, which the normal `build`
  # job does not have and should not gain. Keep the behavioural smoke test in
  # its own job so capability failures remain distinct from build failures.
  ebpf-smoke:
    runs-on: ubuntu-latest
    needs: build
    if: hashFiles('pulsebeam-ebpf/Cargo.toml') != '' && hashFiles('pulsebeam/Cargo.toml') != ''
    continue-on-error: false
    steps:
    - uses: actions/checkout@v5
    - run: sudo apt-get install -y protobuf-compiler clang nasm pkg-config
    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.10
    - name: Install nightly for eBPF build-std
      run: rustup toolchain install nightly --component rust-src --profile minimal
    - name: Build eBPF program
      run: make build-ebpf
    # The test is ignored in ordinary builds because it needs a real kernel
    # eBPF attach; this job is the privileged execution path.
    - name: Attach/load smoke test (privileged)
      run: sudo -E env "PATH=$PATH" cargo test -p pulsebeam --lib ebpf::tests::loader_attaches_to_a_reuseport_group --release -- --ignored --test-threads=1
      env:
        CARGO_TERM_COLOR: always
