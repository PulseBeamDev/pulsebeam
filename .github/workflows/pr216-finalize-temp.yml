name: One-shot PR216 finalizer

on:
  push:
    branches:
      - fix/rtc-screamv2-rfc01
    paths:
      - .pr216-finalize-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rtc-screamv2-rfc01
      - run: rustup component add rustfmt
      - run: python .github/scripts/pr216_finalize.py
      - run: cargo fmt --all
      - run: git diff --check
      - run: cargo test -p pulsebeam-rtc --lib
      - run: cargo test -p pulsebeam-rtc --test scream_scenarios
      - name: Commit reviewed source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr216-finalize-temp.yml .github/scripts/pr216_finalize.py .pr216-finalize-trigger
          git add crates/pulsebeam-rtc
          git commit -m 'fix(rtc): address remaining SCReAM review feedback'
          git push origin HEAD:fix/rtc-screamv2-rfc01
