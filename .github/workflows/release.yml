name: Release
on:
  push:
    tags: ['pulsebeam-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
      - id: plan
        name: Validate version tag against package authority
        run: |
          plan=$(./bazel run //release:plan -- --tag "$GITHUB_REF_NAME")
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
  checks:
    needs: plan
    uses: ./.github/workflows/ci.yml
  binaries:
    needs: [plan, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
      - name: Build architecture-appropriate release assets
        run: |
          ./bazel build --config=release //release:local //release:global
          ./bazel test --config=release //release:contract --test_output=errors
      - name: Validate hashes and executable target
        run: |
          cd bazel-bin/release/artifacts
          sha256sum --check *.sha256
          temporary=$(mktemp -d)
          tar -xJf pulsebeam-${{ matrix.target }}.tar.xz -C "$temporary"
          "$temporary/pulsebeam-${{ matrix.target }}/pulsebeam" --version
          rm -rf "$temporary"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: bazel-bin/release/artifacts/*
          if-no-files-found: error
  global:
    needs: [plan, checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ci
      - run: ./bazel build //release:global
      - uses: actions/upload-artifact@v4
        with:
          name: release-global
          path: bazel-bin/release/global-artifacts/*
          if-no-files-found: error
  validate_image:
    needs: [plan, checks]
    uses: ./.github/workflows/docker.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
      validate_only: true
    permissions:
      contents: read
      packages: write
  publish:
    needs: [plan, binaries, global, validate_image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Validate complete assembly before publication
        run: |
          cd artifacts
          sha256sum --check *.sha256
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -s "pulsebeam-$target.tar.xz"
            test -s "pulsebeam-$target-update"
          done
          test -s pulsebeam-installer.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ fromJSON(needs.plan.outputs.plan).prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes "${args[@]}"
  docker:
    needs: [plan, publish]
    uses: ./.github/workflows/docker.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
      reuse_image: true
    permissions:
      contents: read
      packages: write
    secrets: inherit
