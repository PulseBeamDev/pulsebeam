name: Temporary RTC SCReAM hardening

on:
  push:
    branches:
      - fix/rtc-screamv2-rfc01
    paths:
      - .rtc-scream-hardening-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/rtc-screamv2-rfc01
      - run: rustup component add rustfmt
      - run: python .github/scripts/rtc_scream_hardening.py
      - run: cargo fmt --all
      - run: git diff --check
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/pulsebeam-rtc
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(rtc): address SCReAM review feedback'
          git push origin HEAD:fix/rtc-screamv2-rfc01
