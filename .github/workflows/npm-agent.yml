name: Validate or publish Node agent SDK
on:
  push:
    tags: ['npm-agent-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing npm-agent-v tag to validate
        required: true
        type: string
      publish:
        description: Publish the validated archive to npm
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Verify dispatched ref matches the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: ./.github/actions/setup-ci
      - name: Validate release identity
        run: ./bazel run //release/npm:plan -- --tag "$RELEASE_TAG"
      - name: Complete acceptance
        run: ./bazel test //:test --test_output=errors
      - name: Retain validated archive
        uses: actions/upload-artifact@v4
        with:
          name: node-agent-package
          path: bazel-bin/agents/pulsebeam-agent-native/node_package.tgz
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: validate
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Verify validated commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@v4
        with:
          name: node-agent-package
          path: dist
      - name: Publish the validated archive using npm OIDC
        run: ./bazel run //release/npm:publish -- --tag "$RELEASE_TAG" --archive "$PWD/dist/node_package.tgz"
