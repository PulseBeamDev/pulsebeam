name: PulseBeam Docker Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      validate_only:
        type: boolean
        default: false
      reuse_image:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GHCR_IMAGE: ghcr.io/pulsebeamdev/pulsebeam
jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci
      - name: Build and load Bazel-owned linux/amd64 image
        if: ${{ !inputs.reuse_image }}
        run: ./bazel run --config=release //release:load
      - name: Restore validated release image
        if: ${{ inputs.reuse_image }}
        uses: actions/download-artifact@v8
        with:
          name: pulsebeam-amd64-image
          path: ${{ runner.temp }}/pulsebeam-image
      - name: Load validated release image
        if: ${{ inputs.reuse_image }}
        run: docker load -i "$RUNNER_TEMP/pulsebeam-image/pulsebeam-amd64-image.tar"
      - name: Inspect non-root runtime and argument handling
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' pulsebeam:local)" = '65532:65532'
          test "$(docker image inspect --format '{{.Architecture}}' pulsebeam:local)" = amd64
          docker run --rm pulsebeam:local --help
      - name: Save validated release image
        if: ${{ inputs.validate_only }}
        run: docker save pulsebeam:local -o "$RUNNER_TEMP/pulsebeam-amd64-image.tar"
      - name: Retain validated release image
        if: ${{ inputs.validate_only }}
        uses: actions/upload-artifact@v7
        with:
          name: pulsebeam-amd64-image
          path: ${{ runner.temp }}/pulsebeam-amd64-image.tar
          if-no-files-found: error
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=sha,prefix=,format=long
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Registry login
        if: ${{ !inputs.validate_only && github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish authorized tags without recompilation
        if: ${{ !inputs.validate_only && github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag pulsebeam:local "$tag"
            docker push "$tag"
          done <<< "$TAGS"
