name: Set up the locked Linux OS environment
description: Install Nix for the OS-only flake. Bazel owns language tools, builds and tests.
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
