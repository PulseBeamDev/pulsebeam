name: Set up locked OS inputs
description: Install Nix for Bazel-declared SDK and browser inputs. Bazel runs on the host.
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - uses: bazel-contrib/setup-bazel@0.19.1
      with:
        # Avoid downloading Bazel every time.
        bazelisk-cache: true
        # Store build cache per workflow.
        disk-cache: true
        # Share repository cache between workflows.
        repository-cache: true
