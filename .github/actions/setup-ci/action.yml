name: Set up baseline OS prerequisites
description: Install only the documented Linux runtime libraries and system headers. Bazel owns versioned build tools.
inputs:
  browsers:
    description: Include the pinned browsers' OS runtime libraries.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install baseline OS prerequisites
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl tar xz-utils unzip patch libc6-dev linux-libc-dev libstdc++-13-dev zlib1g-dev
        if [[ '${{ inputs.browsers }}' == true ]]; then
          sudo apt-get install -y libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libgtk-3-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libxrender1 libxt6 libxtst6
        fi
