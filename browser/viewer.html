<!doctype html>
<meta charset="utf-8">
<title>PulseBeam Viewer</title>
<div id="videos"></div>
<script type="module">
  const videoRoot = document.querySelector("#videos");
  const videos = [];
  let peer;

  function addVideo(track) {
    const video = document.createElement("video");
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.srcObject = new MediaStream([track]);
    videoRoot.append(video);
    videos.push(video);
  }

  function codecs() {
    return RTCRtpReceiver.getCapabilities("video")?.codecs
      ?.filter((codec) => codec.mimeType.startsWith("video/"))
      .map((codec) => codec.mimeType.toLowerCase()) ?? [];
  }

  function setCodec(transceiver, codec) {
    if (!codec || !transceiver.setCodecPreferences) return;
    const available = RTCRtpReceiver.getCapabilities("video")?.codecs ?? [];
    const selected = available.filter((candidate) => candidate.mimeType.toLowerCase() === codec);
    if (selected.length > 0) transceiver.setCodecPreferences(selected);
  }

  async function gatherCandidates(peer) {
    if (peer.iceGatheringState === "complete") return;
    await new Promise((resolve) => {
      const onStateChange = () => {
        if (peer.iceGatheringState === "complete") {
          peer.removeEventListener("icegatheringstatechange", onStateChange);
          resolve();
        }
      };
      peer.addEventListener("icegatheringstatechange", onStateChange);
    });
  }

  async function connect({ apiUrl, room, meetShape = false, codec = null }) {
    peer = new RTCPeerConnection();
    if (meetShape) {
      peer.createDataChannel("v1/sys/signaling", { ordered: true });
    }
    if (meetShape) {
      for (let slot = 0; slot < 2; slot += 1) {
        peer.addTransceiver("audio", { direction: "sendonly" });
        peer.addTransceiver("video", {
          direction: "sendonly",
          sendEncodings: [
            { rid: "q", active: false, scalabilityMode: "L1T3" },
            { rid: "h", active: false, scalabilityMode: "L1T3" },
            { rid: "f", active: false, scalabilityMode: "L1T3" },
          ],
        });
      }
      for (let slot = 0; slot < 3; slot += 1) {
        peer.addTransceiver("audio", { direction: "recvonly" });
      }
    }
    for (let slot = 0; slot < 7; slot += 1) {
      const transceiver = peer.addTransceiver("video", { direction: "recvonly" });
      setCodec(transceiver, codec);
    }
    peer.ontrack = ({ track }) => {
      if (track.kind === "video") addVideo(track);
    };

    const offer = await peer.createOffer();
    await peer.setLocalDescription(offer);
    await gatherCandidates(peer);
    const response = await fetch(`${apiUrl}/api/v1/rooms/${room}/participants`, {
      method: "POST",
      headers: { "Content-Type": "application/sdp" },
      body: peer.localDescription.sdp,
    });
    if (!response.ok) throw new Error(`signaling failed: ${response.status}`);
    await peer.setRemoteDescription({ type: "answer", sdp: await response.text() });
  }

  async function stats() {
    const report = await peer.getStats();
    const codecs = new Map();
    const inbound = [];
    for (const item of report.values()) {
      if (item.type === "codec") codecs.set(item.id, item.mimeType);
    }
    for (const item of report.values()) {
      if (item.type === "inbound-rtp" && item.kind === "video") {
        inbound.push({
          bytesReceived: item.bytesReceived ?? 0,
          codec: codecs.get(item.codecId) ?? null,
          framesDecoded: item.framesDecoded ?? 0,
          framesReceived: item.framesReceived ?? 0,
          keyFramesDecoded: item.keyFramesDecoded ?? 0,
        });
      }
    }
    return {
      connectionState: peer.connectionState,
      iceConnectionState: peer.iceConnectionState,
      iceGatheringState: peer.iceGatheringState,
      inbound,
      rendered: videos.map((video) => ({
        height: video.videoHeight,
        readyState: video.readyState,
        width: video.videoWidth,
      })),
    };
  }

  function sdp() {
    return {
      local: peer.localDescription?.sdp ?? null,
      remote: peer.remoteDescription?.sdp ?? null,
      remoteVideo: (peer.remoteDescription?.sdp ?? "")
        .split("m=video")
        .slice(1)
        .slice(0, 2)
        .map((section) => section.split("m=")[0])
        .map((section) => section.split("\r\n").filter((line) => line.startsWith("a=rtpmap:") || line.startsWith("a=fmtp:") || line.startsWith("a=send") || line.startsWith("a=recv")).join("\n")),
    };
  }

  window.pulsebeamViewer = { codecs, connect, stats, sdp };
</script>
