<!doctype html>
<meta charset="utf-8">
<title>PulseBeam Publisher</title>
<script type="module">
  let peer;

  async function gatherCandidates(connection) {
    if (connection.iceGatheringState === "complete") return;
    await new Promise((resolve) => {
      const complete = () => {
        if (connection.iceGatheringState === "complete") {
          connection.removeEventListener("icegatheringstatechange", complete);
          resolve();
        }
      };
      connection.addEventListener("icegatheringstatechange", complete);
    });
  }

  function canvasTrack() {
    const canvas = document.createElement("canvas");
    canvas.width = 320;
    canvas.height = 180;
    const context = canvas.getContext("2d");
    let frame = 0;
    const draw = () => {
      context.fillStyle = `hsl(${frame % 360} 80% 50%)`;
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "white";
      context.fillText(String(frame), 16, 24);
      frame += 1;
      requestAnimationFrame(draw);
    };
    draw();
    return canvas.captureStream(30).getVideoTracks()[0];
  }

  function codecs() {
    return RTCRtpSender.getCapabilities("video")?.codecs
      ?.filter((codec) => codec.mimeType.startsWith("video/"))
      .map((codec) => codec.mimeType.toLowerCase()) ?? [];
  }

  function setCodec(transceiver, codec) {
    if (!codec || !transceiver.setCodecPreferences) return;
    const available = RTCRtpSender.getCapabilities("video")?.codecs ?? [];
    const selected = available.filter((candidate) => candidate.mimeType.toLowerCase() === codec);
    if (selected.length > 0) transceiver.setCodecPreferences(selected);
  }

  async function connect({ apiUrl, room, codec = null }) {
    peer = new RTCPeerConnection();
    const transceiver = peer.addTransceiver(canvasTrack(), { direction: "sendonly" });
    setCodec(transceiver, codec);
    const offer = await peer.createOffer();
    await peer.setLocalDescription(offer);
    await gatherCandidates(peer);
    const response = await fetch(`${apiUrl}/api/v1/rooms/${room}/participants`, {
      method: "POST",
      headers: { "Content-Type": "application/sdp" },
      body: peer.localDescription.sdp,
    });
    if (!response.ok) throw new Error(`signaling failed: ${response.status}`);
    await peer.setRemoteDescription({ type: "answer", sdp: await response.text() });
  }

  async function stats() {
    const report = await peer.getStats();
    const outbound = [];
    for (const value of report.values()) {
      if (value.type === "outbound-rtp" && value.kind === "video") {
        outbound.push({ bytesSent: value.bytesSent ?? 0, packetsSent: value.packetsSent ?? 0 });
      }
    }
    return { connectionState: peer.connectionState, outbound };
  }

  window.pulsebeamPublisher = { codecs, connect, stats };
</script>
