<!doctype html>
<meta charset="utf-8">
<title>PulseBeam Manual Subscriber</title>
<button id="enable-media" type="button">Enable media</button>
<div id="videos"></div>
<script type="module">
  const videoRoot = document.querySelector("#videos");
  const enableMediaButton = document.querySelector("#enable-media");
  const videos = [];
  const text = new TextEncoder();
  const textDecoder = new TextDecoder();
  let peer;
  let signal;
  let mainVideoMid;
  let auxVideoMid;
  let receiverMid;
  let remoteTrackId;
  let desiredHeight = 720;
  let mainSender;
  let mainTrack;
  let mainAudioTrack;
  let audioContext;
  let signalMessages = 0;
  let intentsSent = 0;

  function concat(parts) {
    const length = parts.reduce((sum, part) => sum + part.length, 0);
    const result = new Uint8Array(length);
    let offset = 0;
    for (const part of parts) {
      result.set(part, offset);
      offset += part.length;
    }
    return result;
  }

  function varint(value) {
    const bytes = [];
    do {
      let byte = value & 0x7f;
      value >>>= 7;
      if (value !== 0) byte |= 0x80;
      bytes.push(byte);
    } while (value !== 0);
    return Uint8Array.from(bytes);
  }

  function field(number, payload) {
    return concat([varint(number << 3 | 2), varint(payload.length), payload]);
  }

  function stringField(number, value) {
    return field(number, text.encode(value));
  }

  function boolField(number, value) {
    return concat([varint(number << 3), varint(value ? 1 : 0)]);
  }

  function numberField(number, value) {
    return concat([varint(number << 3), varint(value)]);
  }

  function readVarint(bytes, offset) {
    let value = 0;
    let shift = 0;
    while (offset < bytes.length && shift < 35) {
      const byte = bytes[offset++];
      value |= (byte & 0x7f) << shift;
      if ((byte & 0x80) === 0) return [value, offset];
      shift += 7;
    }
    throw new Error("invalid protobuf varint");
  }

  function fields(bytes, visit) {
    let offset = 0;
    while (offset < bytes.length) {
      let tag;
      [tag, offset] = readVarint(bytes, offset);
      const number = tag >>> 3;
      const wire = tag & 7;
      if (wire === 0) {
        let value;
        [value, offset] = readVarint(bytes, offset);
        visit(number, wire, value);
      } else if (wire === 2) {
        let length;
        [length, offset] = readVarint(bytes, offset);
        const end = offset + length;
        if (end > bytes.length) throw new Error("truncated protobuf field");
        visit(number, wire, bytes.slice(offset, end));
        offset = end;
      } else {
        throw new Error(`unsupported protobuf wire type ${wire}`);
      }
    }
  }

  function publication(bytes) {
    let trackId = null;
    let kind = 0;
    fields(bytes, (number, wire, value) => {
      if (number === 1 && wire === 2) trackId = textDecoder.decode(value);
      if (number === 3 && wire === 0) kind = value;
    });
    return { trackId, kind };
  }

  function consumeState(bytes) {
    fields(bytes, (outerNumber, outerWire, outerValue) => {
      if (outerNumber !== 1 || outerWire !== 2) return;
      fields(outerValue, (number, wire, value) => {
        if (number !== 4 || wire !== 2) return;
        const item = publication(value);
        if (item.kind === 1 && item.trackId !== null) remoteTrackId = item.trackId;
      });
    });
  }

  function sendIntent() {
    if (signal?.readyState !== "open" || !mainVideoMid || !auxVideoMid || !receiverMid) return;
    const publish = [
      [mainVideoMid, true],
      [auxVideoMid, false],
    ].sort(([left], [right]) => left.localeCompare(right)).map(([mid, active]) =>
      field(3, concat([stringField(1, mid), boolField(2, active)])));
    const video = remoteTrackId === null ? [] : [field(1, concat([
      stringField(1, receiverMid),
      stringField(2, remoteTrackId),
      numberField(3, desiredHeight),
      numberField(4, Math.min(desiredHeight, 180)),
      numberField(6, 200),
    ]))];
    const audio = signalMessages === 0 ? [] : [field(2, boolField(2, true))];
    signal.send(field(1, concat([...video, ...audio, ...publish])));
    intentsSent += 1;
  }

  function canvasTrack() {
    const canvas = document.createElement("canvas");
    canvas.width = 1280;
    canvas.height = 720;
    const context = canvas.getContext("2d");
    let frame = 0;
    const draw = () => {
      context.fillStyle = `hsl(${frame % 360} 80% 50%)`;
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "white";
      context.fillText(String(frame), 16, 24);
      frame += 1;
      requestAnimationFrame(draw);
    };
    draw();
    return canvas.captureStream(30).getVideoTracks()[0];
  }

  async function enableMedia() {
    if (mainAudioTrack) return;
    audioContext = new AudioContext();
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const destination = audioContext.createMediaStreamDestination();
    oscillator.frequency.value = 440;
    gain.gain.value = 0.1;
    oscillator.connect(gain).connect(destination);
    oscillator.start();
    await audioContext.resume();
    mainAudioTrack = destination.stream.getAudioTracks()[0];
  }

  enableMediaButton.addEventListener("click", enableMedia);

  async function activateMotionSender(sender, track) {
    await sender.replaceTrack(track);
    const parameters = sender.getParameters();
    const configuration = new Map([
      ["q", { active: true, scaleResolutionDownBy: 4, maxBitrate: 187500, maxFramerate: 30 }],
      ["h", { active: true, scaleResolutionDownBy: 2, maxBitrate: 437500, maxFramerate: 30 }],
      ["f", { active: true, scaleResolutionDownBy: 1, maxBitrate: 1250000, maxFramerate: 30 }],
    ]);
    parameters.encodings.forEach((encoding, index) => {
      const desired = configuration.get(encoding.rid) ?? [...configuration.values()][index];
      if (desired) Object.assign(encoding, desired);
    });
    await sender.setParameters(parameters);
  }

  function mids(sdp) {
    const sections = sdp.split(/^m=/m).slice(1);
    return sections.map((section) => {
      const kind = section.split(/\r?\n/, 1)[0].split(" ", 1)[0];
      const mid = section.match(/^a=mid:(.+)$/m)?.[1];
      return { kind, mid };
    });
  }

  async function gatherCandidates(connection) {
    if (connection.iceGatheringState === "complete") return;
    await new Promise((resolve) => {
      const complete = () => {
        if (connection.iceGatheringState === "complete") {
          connection.removeEventListener("icegatheringstatechange", complete);
          resolve();
        }
      };
      connection.addEventListener("icegatheringstatechange", complete);
    });
  }

  async function connect({ apiUrl, room }) {
    if (!mainAudioTrack) throw new Error("media must be enabled before connecting");
    remoteTrackId = null;
    peer = new RTCPeerConnection({
      iceServers: [],
      bundlePolicy: "max-bundle",
      rtcpMuxPolicy: "require",
      iceCandidatePoolSize: 0,
    });
    signal = peer.createDataChannel("v1/sys/signaling", { ordered: true });
    signal.binaryType = "arraybuffer";
    signal.onopen = sendIntent;
    signal.onmessage = ({ data }) => {
      signalMessages += 1;
      consumeState(new Uint8Array(data));
      sendIntent();
    };
    peer.addTransceiver(mainAudioTrack, { direction: "sendonly" });
    mainTrack = canvasTrack();
    const mainVideo = peer.addTransceiver(mainTrack, {
      direction: "sendonly",
      sendEncodings: [
        { rid: "q", active: true, scaleResolutionDownBy: 4, maxBitrate: 187500, maxFramerate: 30, scalabilityMode: "L1T3" },
        { rid: "h", active: true, scaleResolutionDownBy: 2, maxBitrate: 437500, maxFramerate: 30, scalabilityMode: "L1T3" },
        { rid: "f", active: true, scaleResolutionDownBy: 1, maxBitrate: 1250000, maxFramerate: 30, scalabilityMode: "L1T3" },
      ],
    });
    peer.addTransceiver("audio", { direction: "sendonly" });
    const auxVideo = peer.addTransceiver("video", {
      direction: "sendonly",
      sendEncodings: [
        { rid: "q", active: false, scalabilityMode: "L1T3" },
        { rid: "h", active: false, scalabilityMode: "L1T3" },
        { rid: "f", active: false, scalabilityMode: "L1T3" },
      ],
    });
    for (let index = 0; index < 3; index += 1) {
      peer.addTransceiver("audio", { direction: "recvonly" });
    }
    const videoSlots = [];
    for (let index = 0; index < 7; index += 1) {
      videoSlots.push(peer.addTransceiver("video", { direction: "recvonly" }));
    }
    peer.ontrack = ({ track }) => {
      if (track.kind !== "video") return;
      const video = document.createElement("video");
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      video.srcObject = new MediaStream([track]);
      videoRoot.append(video);
      videos.push(video);
      const play = () => video.play().catch(() => {});
      video.addEventListener("loadedmetadata", play, { once: true });
      play();
    };
    await peer.setLocalDescription(await peer.createOffer());
    ({ mainVideoMid, auxVideoMid, receiverMid } = (() => {
      const sections = mids(peer.localDescription.sdp);
      const video = sections.filter((section) => section.kind === "video");
      if (video.length !== 9 || !mainVideo.mid || !auxVideo.mid || !videoSlots[0].mid) {
        throw new Error("expected PulseBeam SDK send and receive video mids");
      }
      return {
        mainVideoMid: mainVideo.mid,
        auxVideoMid: auxVideo.mid,
        receiverMid: videoSlots[0].mid,
      };
    })());
    await gatherCandidates(peer);
    const response = await fetch(`${apiUrl}/api/v1/rooms/${room}/participants?manual_sub=true`, {
      method: "POST",
      headers: { "Content-Type": "application/sdp" },
      body: peer.localDescription.sdp,
    });
    if (!response.ok) throw new Error(`signaling failed: ${response.status}`);
    await peer.setRemoteDescription({ type: "answer", sdp: await response.text() });
    mainSender = mainVideo.sender;
    await activateMotionSender(mainSender, mainTrack);
    sendIntent();
  }

  function supportsH264() {
    return RTCRtpSender.getCapabilities("video")?.codecs
      ?.some((codec) => codec.mimeType.toLowerCase() === "video/h264") === true &&
      RTCRtpReceiver.getCapabilities("video")?.codecs
        ?.some((codec) => codec.mimeType.toLowerCase() === "video/h264") === true;
  }

  function setSubscriptionHeight(height) {
    desiredHeight = height;
    sendIntent();
  }

  async function setPublishing(active) {
    await mainSender.replaceTrack(active ? mainTrack : null);
  }

  async function exerciseDataBackpressure() {
    if (signal?.readyState !== "open") throw new Error("data channel is not open");
    signal.bufferedAmountLowThreshold = 0;
    const drained = new Promise((resolve) => {
      signal.addEventListener("bufferedamountlow", resolve, { once: true });
      setTimeout(resolve, 5_000);
    });
    for (let index = 0; index < 512; index += 1) sendIntent();
    const peakBufferedAmount = signal.bufferedAmount;
    if (peakBufferedAmount > 0) await drained;
    return {
      peakBufferedAmount,
      finalBufferedAmount: signal.bufferedAmount,
    };
  }

  async function stats() {
    const report = await peer.getStats();
    const codecs = new Map();
    for (const value of report.values()) {
      if (value.type === "codec") codecs.set(value.id, value.mimeType ?? null);
    }
    const inbound = [];
    const outbound = [];
    const inboundAudio = [];
    const outboundAudio = [];
    const remoteInbound = [];
    for (const value of report.values()) {
      if (value.type === "outbound-rtp" && value.kind === "video") {
        outbound.push({
          bytesSent: value.bytesSent ?? 0,
          packetsSent: value.packetsSent ?? 0,
          codec: codecs.get(value.codecId) ?? null,
          mid: value.mid ?? null,
          rid: value.rid ?? null,
          payloadType: value.payloadType ?? null,
          frameWidth: value.frameWidth ?? null,
          frameHeight: value.frameHeight ?? null,
          framesEncoded: value.framesEncoded ?? 0,
          targetBitrate: value.targetBitrate ?? null,
          qualityLimitationReason: value.qualityLimitationReason ?? null,
          qualityLimitationDurations: value.qualityLimitationDurations ?? null,
        });
      }
      if (value.type === "inbound-rtp" && value.kind === "video") {
        inbound.push({
          packetsReceived: value.packetsReceived ?? 0,
          framesDecoded: value.framesDecoded ?? 0,
          keyFramesDecoded: value.keyFramesDecoded ?? 0,
          nackCount: value.nackCount ?? 0,
          pliCount: value.pliCount ?? 0,
          jitterBufferDelay: value.jitterBufferDelay ?? 0,
          jitterBufferEmittedCount: value.jitterBufferEmittedCount ?? 0,
          frameWidth: value.frameWidth ?? null,
          frameHeight: value.frameHeight ?? null,
          codec: codecs.get(value.codecId) ?? null,
          mid: value.mid ?? null,
          payloadType: value.payloadType ?? null,
        });
      }
      if (value.type === "outbound-rtp" && value.kind === "audio") {
        outboundAudio.push({
          packetsSent: value.packetsSent ?? 0,
          bytesSent: value.bytesSent ?? 0,
          codec: codecs.get(value.codecId) ?? null,
        });
      }
      if (value.type === "inbound-rtp" && value.kind === "audio") {
        inboundAudio.push({
          packetsReceived: value.packetsReceived ?? 0,
          bytesReceived: value.bytesReceived ?? 0,
          packetsLost: value.packetsLost ?? 0,
          codec: codecs.get(value.codecId) ?? null,
        });
      }
      if (value.type === "remote-inbound-rtp") {
        remoteInbound.push({
          kind: value.kind ?? null,
          localId: value.localId ?? null,
          packetsLost: value.packetsLost ?? null,
          fractionLost: value.fractionLost ?? null,
          roundTripTime: value.roundTripTime ?? null,
          totalRoundTripTime: value.totalRoundTripTime ?? null,
          roundTripTimeMeasurements: value.roundTripTimeMeasurements ?? null,
        });
      }
    }
    const sendEncodings = peer.getTransceivers()
      .filter((transceiver) => transceiver.sender.track?.kind === "video")
      .map((transceiver) => ({
        mid: transceiver.mid,
        encodings: transceiver.sender.getParameters().encodings.map((encoding) => ({
          rid: encoding.rid ?? null,
          active: encoding.active ?? true,
          scaleResolutionDownBy: encoding.scaleResolutionDownBy ?? null,
          maxBitrate: encoding.maxBitrate ?? null,
          maxFramerate: encoding.maxFramerate ?? null,
        })),
      }));
    const selectedCandidatePair = [...report.values()].find((value) =>
      value.type === "candidate-pair" && value.nominated && value.state === "succeeded");
    return {
      connectionState: peer.connectionState,
      remoteTrackId,
      inbound,
      outbound,
      inboundAudio,
      outboundAudio,
      remoteInbound,
      sendEncodings,
      availableOutgoingBitrate: selectedCandidatePair?.availableOutgoingBitrate ?? null,
      dataChannel: {
        intentsSent,
        messagesReceived: signalMessages,
        readyState: signal?.readyState ?? "closed",
      },
      rendered: videos.map((video) => ({ width: video.videoWidth, height: video.videoHeight })),
    };
  }

  function sdp() {
    const facts = (description) => description?.split("\r\n")
      .filter((line) => line.startsWith("a=rid:") || line.startsWith("a=simulcast:")) ?? [];
    return {
      local: facts(peer?.localDescription?.sdp),
      remote: facts(peer?.remoteDescription?.sdp),
    };
  }

  window.pulsebeamManual = {
    connect,
    exerciseDataBackpressure,
    sdp,
    setPublishing,
    setSubscriptionHeight,
    stats,
    supportsH264,
  };
</script>
