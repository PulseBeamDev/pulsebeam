# Native test knobs. Covers unwrap/expect/panic/indexing/dbg/print inside
# `#[cfg(test)]` — a test process ending is the assertion mechanism, not an
# outage, so these lints have no business firing there.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Architectural lints. See `docs/thread-per-core.md`; `make lint-check` gates on
# these, so a violation fails rather than scrolling past in a build log.
#
# Two tables below, both thread-per-core rules: `disallowed-types` keeps shared
# state out of the shards, `disallowed-methods` keeps blocking calls out of
# them. Determinism is *not* enforced here — see the note above the second
# table for why the simulator handles it better.
#
# ---------------------------------------------------------------------------
# Shared-state primitives.
#
# This is a thread-per-core SFU: a shard owns its participants, its routes and
# its packet buffers outright, and reaches other shards only by message. Cross-
# core sharing is not a performance trade-off here, it is a design error — it
# reintroduces the coherence traffic and the torn reads the architecture exists
# to avoid, and it does not survive the move to a second node, where there is no
# shared memory to reach into at all.
#
# Every one of these has a legitimate narrow use. Take the escape hatch with a
# comment saying which:
#
#     #[allow(clippy::disallowed_types)] // <reason>
#
# The point of the deny is not that these are forbidden. It is that reaching for
# one has to be a decision somebody wrote down.
disallowed-types = [
    { path = "bytes::Bytes", reason = "refcounted payload shared across shard boundaries. Cross-shard data is copied deliberately so allocation and release stay core-local; use Vec<u8> unless an explicit, reviewed exception is required." },
    { path = "std::sync::Arc", reason = "cross-core refcount. Fine when the count is bounded and touched at startup (one per shard); wrong on any path that runs per packet. Prefer Rc, or an owned value the shard holds outright." },
    { path = "std::sync::Mutex", reason = "a shard must never block on another shard. Use a message." },
    { path = "std::sync::RwLock", reason = "as Mutex. A reader still takes a cache line other cores want." },
    { path = "std::sync::atomic::AtomicBool", reason = "shared mutable state. Several atomics read together do not form a consistent snapshot — see docs/thread-per-core.md. Fine for a fixed, preallocated counter set like ShardMetrics." },
    { path = "std::sync::atomic::AtomicU8", reason = "as AtomicBool." },
    { path = "std::sync::atomic::AtomicU32", reason = "as AtomicBool." },
    { path = "std::sync::atomic::AtomicU64", reason = "as AtomicBool." },
    { path = "std::sync::atomic::AtomicUsize", reason = "as AtomicBool." },
]

# ---------------------------------------------------------------------------
# Blocking.
#
# A shard runs on a current-thread runtime and owns every participant on it, so
# a call that parks the thread stalls all of them — not just the one being
# served. Under simulation it is worse: real sleeping blocks the simulated world
# and burns wall time turmoil was about to skip.
#
# Note what is *not* here: the clock and the RNG.
#
# `SystemTime::now`, `std::time::Instant::now`, `thread_rng` and friends are
# fine. `pulsebeam-simulator` overrides `clock_gettime` (CLOCK_REALTIME and
# CLOCK_MONOTONIC) and `getrandom(2)` for the whole process, so under a plan
# they already return simulated time and seeded bytes. That shim is strictly
# better than a lint could be, because it also reaches inside dependencies —
# tracing, hashers, DTLS key generation — which no rule about our own source can
# touch. Banning the calls would forbid something the harness has already made
# safe. See `sim_clock.rs` and `sim_rand.rs` for why they exist.
disallowed-methods = [
    { path = "std::thread::sleep", reason = "blocks the whole shard. In a test it also blocks the simulated world and waits on real time, which is what makes a plan slow and flaky rather than deterministic. Use tokio::time::sleep or a deterministic tick." },
    { path = "tokio::task::block_in_place", reason = "a shard runs on a current-thread runtime; there is no pool to hand the work to." },
    { path = "futures::executor::block_on", reason = "blocks the shard's own executor. Restricted to runtime startup." },
    { path = "metrics::set_global_recorder", reason = "a global recorder is shared mutable state on the packet path: its registry locks and its render walk the same cache lines every shard writes, which is what put spikes in the forwarding tail. Shards install their own recorder per tick (shard::recorder) and report by message. The one legitimate global is the Prometheus exporter for control-plane metrics, in node.rs." },
    { path = "metrics_exporter_prometheus::PrometheusBuilder::install_recorder", reason = "same as metrics::set_global_recorder — this is the call that installs one. Pinned to the single site in node.rs so a second one cannot appear without review." },
]
# Not listed: `tokio::runtime::Runtime::block_on`. `#[tokio::test]` expands to
# it, so the rule fires on every async test and cannot be satisfied. The two
# real uses (`main.rs`, `node.rs`) are runtime startup and would be allowed
# anyway.
