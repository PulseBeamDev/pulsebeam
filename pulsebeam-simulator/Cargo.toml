[package]
name = "pulsebeam-simulator"
version.workspace = true
authors.workspace = true
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false


[lints]
workspace = true

[dev-dependencies]
anyhow.workspace = true
bytes = "1"
ctor = "1.0.10"
futures = "0.3.32"
http = "1.4.1"
http-body-util = "0.1"  # Crucial for .collect().await
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1"] }
libc = "0.2"
pin-project-lite = "0.2.17"
rand.workspace = true
proptest = "1.11.0"
pulsebeam = { path = "../pulsebeam", features = ["sim"] }
pulsebeam-agent = { path = "../pulsebeam-agent", features = ["sim"] }
pulsebeam-core = { path = "../pulsebeam-core", features = ["sim"] }
pulsebeam-runtime = { path = "../pulsebeam-runtime", features = ["sim"] }
pulsebeam-testdata = { path = "../pulsebeam-testdata" }
reqwest = "0.13.4"
tokio.workspace = true
tokio-util.workspace = true
tower = { version = "0.5.3", features = ["util"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
turmoil.workspace = true

[features]
default = ["parking_lot"]
parking_lot = ["pulsebeam-runtime/parking_lot", "pulsebeam/parking_lot"]
