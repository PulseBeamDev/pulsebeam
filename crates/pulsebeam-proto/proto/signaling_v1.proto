syntax = "proto3";

package pulsebeam.media.v1;

// Live signaling over a reliable, ordered data channel.
//
// HTTP owns WebRTC participant creation and destruction. This protocol owns:
//
//   Catalog       — what exists remotely.
//   Intent        — what this participant wants to send and receive.
//   Mapping       — which remote tracks are assigned to local receivers.
//   Authorization — refresh of the participant JWT.
//
// State shape:
//
//   Intent
//   ├── SendIntent
//   │   └── tracks[]
//   │
//   └── ReceiveIntent
//       ├── VideoIntent
//       │   └── tracks[]
//       │       ├── track_id
//       │       └── options
//       │           ├── height
//       │           ├── min_height
//       │           ├── min_fps
//       │           ├── priority
//       │           └── playout_delay
//       │
//       └── AudioIntent
//           ├── tracks[]
//           │   ├── track_id
//           │   └── options
//           │       └── playout_delay
//           └── mode
//
//   Mapping
//   ├── video
//   │   └── tracks[]
//   └── audio
//       └── tracks[]
//
// Examples:
//
//   LocalTrack:
//     sender 1, VIDEO, "camera"
//
//   RemoteTrack:
//     track vid_A, participant pa_A, VIDEO, "camera"
//
//   Video receive intent:
//     track vid_A
//       height       = 720
//       min_height   = 360
//       min_fps      = 15
//       priority     = 10
//       playout_delay = [0ms, 50ms]
//
//   Audio receive intent with three negotiated audio receivers:
//     tracks = [aud_A]
//     mode   = AUDIO_MODE_AUTO
//
//   The server selects Alice first and may automatically fill the remaining
//   receivers.
//
//   Mapping:
//     audio receiver 0 -> aud_A
//     audio receiver 1 -> aud_B
//     audio receiver 2 -> aud_C
//
// Track identity:
//
//   LocalTrack  = (kind, label)
//   RemoteTrack = TrackId
//
// The client SDK resolves application-facing selectors such as
// (participant_external_id, kind, label) to TrackId using Catalog.
//
// `sender_id` and `receiver_id` are connection-local identifiers equal to the
// zero-based SDP media-section index of the corresponding negotiated RTP
// sender or receiver.
//
// They MUST NOT be used as application identity.
//
// Catalog, Intent, and Mapping are complete replacement state, not patches.
// An invalid Intent is rejected atomically.
//
// Option field numbering:
//
//   Low field numbers are reserved for common, frequently encoded options.
//   Optional or less frequently used controls start from the high end of the
//   one-byte protobuf tag range.
//
//   Protobuf field numbers 1..15 encode their field key in one byte.
//   Field numbers 16 and above require at least two bytes.
//
//   `playout_delay` therefore uses tag 15:
//
//     - it remains one-byte encoded when present;
//     - it stays out of the low-number range reserved for hot/common fields;
//     - tags between the required options and 15 remain available for future
//       commonly used controls.
//
// This convention should be preserved when extending option messages.
//
// Wire encoding:
//
// Each data-channel message contains exactly one signaling message.
//
// The message payload is:
//
//   protobuf -> LZ4
//
// Both endpoints MUST encode every ClientMessage and ServerMessage with LZ4
// after protobuf serialization and MUST decompress before protobuf decoding.
//
// Compression state is scoped to the signaling transport as defined by the LZ4
// implementation used by the protocol.
//
// Receivers MUST enforce the protocol's maximum uncompressed signaling-message
// size before accepting decompressed data.


// ============================================================================
// Common
// ============================================================================

enum TrackKind {
  TRACK_KIND_UNSPECIFIED = 0;
  AUDIO = 1;
  VIDEO = 2;
  DATA = 3;
}

// One participant visible in the room.
//
// `id` is the canonical ParticipantId.
// `external_id` is the application-supplied ParticipantExternalId.
// Application metadata such as display name or avatar belongs to application
// signaling.
message Participant {
  string id = 1;
  string external_id = 2;
}

// A track owned by this participant.
//
// `sender_id` identifies its negotiated local sender.
// `kind` MUST match the negotiated media section.
message LocalTrack {
  uint32 sender_id = 1;
  TrackKind kind = 2;
  string label = 3;
}

// A track visible from the room.
//
// `id` is the canonical TrackId.
// (participant_id, kind, label) describes the application-facing track.
message RemoteTrack {
  string id = 1;
  string participant_id = 2;
  TrackKind kind = 3;
  string label = 4;
}


// ============================================================================
// 1. Catalog — what exists remotely
// ============================================================================

// Complete remote room state.
//
// Each Catalog replaces the previous Catalog.
message Catalog {
  repeated Participant participants = 1;
  repeated RemoteTrack tracks = 2;
}


// ============================================================================
// 2. Intent — what this participant wants
// ============================================================================

// Complete desired local sending state.
message SendIntent {
  repeated LocalTrack tracks = 1;
}


// ---------------------------------------------------------------------------
// Receive options
// ---------------------------------------------------------------------------

// Receiver playout-delay bounds for one remote stream.
//
// Values are milliseconds.
//
// min_ms == 0 && max_ms == 0:
//   request minimum possible buffering.
//
// Otherwise:
//   min_ms MUST be <= max_ms.
//
// The control applies only to the stream carrying the associated TrackId.
message PlayoutDelay {
  uint32 min_ms = 1;
  uint32 max_ms = 2;
}

// Receive options for one remote video track.
//
// Required/common video controls occupy the lowest field numbers.
//
// `playout_delay` is optional and deliberately uses field 15, the highest
// protobuf field number whose field key still encodes in one byte.
message VideoOptions {
  // Target rendered height in physical pixels.
  //
  // 0 means hidden/off-screen and permits forwarding to stop.
  uint32 height = 1;

  // Lowest useful rendered height under contention.
  //
  // 0 means fully droppable.
  uint32 min_height = 2;

  // Lowest useful frame rate under contention.
  //
  // 0 means no explicit minimum.
  uint32 min_fps = 3;

  // Relative contention priority.
  //
  // Higher values are more important.
  uint32 priority = 4;

  // Optional per-stream receiver playout-delay bounds.
  optional PlayoutDelay playout_delay = 15;
}

// Desired state for one remote video track.
message VideoTrackIntent {
  string track_id = 1;
  VideoOptions options = 2;
}

// Complete desired remote video state.
message VideoIntent {
  repeated VideoTrackIntent tracks = 1;
}


// ---------------------------------------------------------------------------
// Audio receive intent
// ---------------------------------------------------------------------------

// Receive options for one explicitly requested remote audio track.
//
// `playout_delay` uses tag 15 for the same numbering convention as VideoOptions.
message AudioOptions {
  optional PlayoutDelay playout_delay = 15;
}

// Desired state for one explicitly requested remote audio track.
message AudioTrackIntent {
  string track_id = 1;
  AudioOptions options = 2;
}

enum AudioMode {
  // Select explicit tracks first, then automatically fill remaining negotiated
  // audio receiver capacity.
  AUDIO_MODE_AUTO = 0;

  // Select only explicit tracks. Remaining audio receivers stay unused.
  AUDIO_MODE_EXPLICIT_ONLY = 1;
}

// Complete desired remote audio state.
//
// `tracks` contains explicitly requested audio tracks in preference order.
//
// In AUDIO_MODE_AUTO:
//
//   1. Available entries from `tracks` are selected first.
//   2. Remaining audio receiver capacity may be filled automatically.
//
// In AUDIO_MODE_EXPLICIT_ONLY:
//
//   Only available entries from `tracks` are selected.
//
// Per-track options apply only to explicitly listed tracks. Automatically
// selected tracks use the receiver's default playout behavior.
//
// Audio levels, speaker rank, speaking state, and selection scores are
// intentionally not exposed by this protocol.
message AudioIntent {
  repeated AudioTrackIntent tracks = 1;
  AudioMode mode = 2;
}


// ---------------------------------------------------------------------------
// Complete receive/send intent
// ---------------------------------------------------------------------------

// Complete desired remote receiving state.
//
// VideoIntent and AudioIntent are peers:
//
//   video = explicit video tracks with per-track receive options
//   audio = explicit audio tracks with per-track options plus selection policy
message ReceiveIntent {
  VideoIntent video = 1;
  AudioIntent audio = 2;
}

// Complete desired media state.
//
// Every accepted Intent atomically replaces the previous Intent.
//
// `revision` is client-owned, monotonically increasing, and scoped to this
// signaling connection. It correlates Mapping and errors.
//
// Receive intent references canonical TrackIds.
message Intent {
  uint64 revision = 1;
  SendIntent send = 2;
  ReceiveIntent receive = 3;
}


// ============================================================================
// 3. Mapping — where remote tracks are delivered
// ============================================================================

// One remote track assigned to one negotiated local receiver.
//
// `receiver_id` is the zero-based SDP media-section index of that receiver.
//
// The client resolves:
//
//   receiver_id
//       -> RTCRtpReceiver
//       -> MediaStreamTrack
//       -> TrackId
message TrackMapping {
  uint32 receiver_id = 1;
  string track_id = 2;
}

// Complete current mapping for one media kind.
//
// Receivers without an assigned track are omitted.
// Entry ordering has no semantic meaning.
message MediaMapping {
  repeated TrackMapping tracks = 1;
}

// Complete current receive mapping.
//
// Each Mapping replaces the previous Mapping.
//
// `intent_revision` is the latest Intent accepted by the server.
//
// Mapping changes when an actual receiver-to-track assignment changes, not
// merely because audio activity, congestion, bitrate, or video layer changes.
message Mapping {
  uint64 intent_revision = 1;
  MediaMapping video = 2;
  MediaMapping audio = 3;
}


// ============================================================================
// 4. Authorization — refresh the participant JWT
// ============================================================================

// Presents a fresh customer-signed JWT for this live participant.
//
// The token MUST authorize the same participant and room.
//
// Accepted renewal extends authorization only. It does not modify SDP,
// Catalog, Intent, or Mapping.
//
// Tokens are secrets and MUST NOT be logged.
message RenewAuthorization {
  string token = 1;
}

// Current server-authoritative authorization deadline.
//
// Sent when signaling becomes ready and after an accepted renewal.
//
// Unix seconds using JWT NumericDate representation.
message Authorization {
  int64 expires_at_unix_seconds = 1;
}


// ============================================================================
// Errors
// ============================================================================

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;

  INVALID_MESSAGE = 1;
  INVALID_INTENT = 2;
  INVALID_SENDER = 3;
  INVALID_TRACK = 4;

  AUTHORIZATION_REJECTED = 5;
  AUTHORIZATION_EXPIRED = 6;

  PROTOCOL_ERROR = 7;
  INTERNAL = 8;
}

// Machine-readable protocol failure.
//
// `message` is diagnostic only and MUST NOT be parsed.
//
// `intent_revision` is present when a specific Intent was rejected.
//
// A rejected Intent never modifies the previously accepted Intent.
//
// `fatal` means safe signaling cannot continue.
message Error {
  ErrorCode code = 1;
  string message = 2;
  bool fatal = 3;
  optional uint64 intent_revision = 4;
}


// ============================================================================
// Transport
// ============================================================================

message ClientMessage {
  oneof payload {
    Intent intent = 1;
    RenewAuthorization renew_authorization = 2;
  }
}

message ServerMessage {
  oneof payload {
    Catalog catalog = 1;
    Mapping mapping = 2;
    Authorization authorization = 3;
    Error error = 4;
  }
}
