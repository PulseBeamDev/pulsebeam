syntax = "proto3";

package pulsebeam.media.v1;

// Live media signaling over a reliable, ordered data channel.
//
// HTTP owns connection-resource creation and destruction. This protocol owns:
//
//   Catalog       — canonical remote media entities visible to this participant.
//   Intent        — what this participant wants to send and receive.
//   Mapping       — which remote tracks are assigned to local receivers.
//   Authorization — refresh of the participant JWT.
//
// State shape:
//
//   Intent
//   ├── SendIntent
//   │   └── tracks[]
//   │
//   └── ReceiveIntent
//       ├── VideoIntent
//       │   └── tracks[]
//       │       ├── track_id
//       │       └── options
//       │           ├── height
//       │           ├── min_height
//       │           ├── min_fps
//       │           ├── priority
//       │           └── playout_delay
//       │
//       └── AudioIntent
//           ├── tracks[]
//           │   ├── track_id
//           │   └── options
//           │       └── playout_delay
//           └── mode
//
//   Mapping
//   ├── video
//   │   └── tracks[]
//   └── audio
//       └── tracks[]
//
// Identity boundaries:
//
//   ParticipantExternalId
//       User-application identity supplied through authorization.
//
//   ParticipantId
//       Stable canonical participant identity owned by PulseBeam.
//
//   TrackId
//       Stable canonical track identity owned by PulseBeam.
//
//   sender_index / receiver_index
//       Connection-local SDP media-section indices. They are protocol
//       coordinates, not entity identities.
//
// Clients and SDKs may retain, compare, and return canonical IDs received from
// PulseBeam, but MUST NOT mint, derive, parse, validate, or format their
// canonical representation.
//
// Examples:
//
//   LocalTrack:
//     sender_index = 1
//     kind         = VIDEO
//     label        = "camera"
//
//   RemoteTrack:
//     track_id       = "vid_0..."
//     participant_id = "pa_0..."
//     kind           = VIDEO
//     label          = "camera"
//
//   Video receive intent:
//     track vid_0...
//       height        = 720
//       min_height    = 360
//       min_fps       = 15
//       priority      = 10
//       playout_delay = [0ms, 50ms]
//
//   Audio receive intent with three negotiated audio receivers:
//
//     tracks = [aud_0...]
//     mode   = AUDIO_MODE_AUTO
//
//   The server selects the explicitly requested track first and may
//   automatically fill the remaining receivers.
//
//   Mapping:
//
//     audio receiver_index 0 -> aud_0...
//     audio receiver_index 1 -> aud_0...
//     audio receiver_index 2 -> aud_0...
//
// Track identity:
//
//   LocalTrack  = (kind, label)
//   RemoteTrack = TrackId
//
// The client SDK resolves application-facing selectors such as
// (participant_external_id, kind, label) to TrackId using Catalog.
//
// `sender_index` and `receiver_index` are connection-local identifiers equal
// to the zero-based SDP media-section index of the corresponding negotiated RTP
// sender or receiver.
//
// They MUST NOT be used as application or PulseBeam entity identity.
//
// Catalog, Intent, and Mapping are complete replacement state, not patches.
// An invalid Intent is rejected atomically.
//
// Option field numbering:
//
//   Low field numbers are reserved for common, frequently encoded options.
//   Optional or less frequently used controls start from the high end of the
//   one-byte protobuf tag range.
//
//   Protobuf field numbers 1..15 encode their field key in one byte.
//   Field numbers 16 and above require at least two bytes.
//
//   `playout_delay` therefore uses tag 15:
//
//     - it remains one-byte encoded when present;
//     - it stays out of the low-number range reserved for hot/common fields;
//     - tags between the required options and 15 remain available for future
//       commonly used controls.
//
// This convention should be preserved when extending option messages.
//
// Wire encoding:
//
// Each data-channel message contains exactly one signaling message.
//
// The message payload is:
//
//   protobuf -> LZ4
//
// Both endpoints MUST encode every ClientMessage and ServerMessage with LZ4
// after protobuf serialization and MUST decompress before protobuf decoding.
//
// Compression state is scoped to the signaling transport as defined by the LZ4
// implementation used by the protocol.
//
// Receivers MUST enforce the protocol's maximum uncompressed signaling-message
// size before accepting decompressed data.


// ============================================================================
// Common
// ============================================================================

enum TrackKind {
  TRACK_KIND_UNSPECIFIED = 0;
  AUDIO = 1;
  VIDEO = 2;
  DATA = 3;
}


// One participant visible in the room.
//
// `participant_id` is the canonical ParticipantId owned by PulseBeam.
//
// `participant_external_id` is the application-supplied ParticipantExternalId
// from the participant's authorization.
//
// Application metadata such as display name or avatar belongs to application
// signaling.
message Participant {
  string participant_id = 1;
  string participant_external_id = 2;
}


// A local track owned by this participant.
//
// A LocalTrack does not carry a TrackId. Its application-facing identity is
// `(kind, label)` until PulseBeam derives the corresponding canonical TrackId.
//
// `sender_index` identifies the negotiated local RTP sender by the zero-based
// SDP media-section index.
//
// `sender_index` is scoped to this connection. It is not an Id, Address,
// Handle, or application identity.
//
// `kind` MUST match the negotiated media section.
message LocalTrack {
  uint32 sender_index = 1;
  TrackKind kind = 2;
  string label = 3;
}


// A remote track visible to this participant.
//
// `track_id` is the canonical TrackId owned by PulseBeam.
//
// `participant_id` is the canonical ParticipantId of the owning participant.
//
// `(participant_id, kind, label)` describes the application-facing track and
// allows SDKs to associate the canonical TrackId with application selectors.
message RemoteTrack {
  string track_id = 1;
  string participant_id = 2;
  TrackKind kind = 3;
  string label = 4;
}


// ============================================================================
// 1. Catalog — canonical remote media entities visible to this participant
// ============================================================================

// Complete server-authoritative remote room state visible to this participant.
//
// Each Catalog atomically replaces the previous Catalog.
//
// Participants and tracks carry canonical PulseBeam IDs. SDKs may retain,
// compare, hash, and protocol-forward these values, but MUST treat their
// canonical encoding as opaque.
message Catalog {
  repeated Participant participants = 1;
  repeated RemoteTrack tracks = 2;
}


// ============================================================================
// 2. Intent — what this participant wants
// ============================================================================

// Complete desired local sending state.
//
// Each entry identifies one negotiated local sender through its connection-local
// sender_index and gives that sender its application-facing `(kind, label)`.
//
// Accepted state is interpreted together with the enclosing Intent.
message SendIntent {
  repeated LocalTrack tracks = 1;
}


// ---------------------------------------------------------------------------
// Receive options
// ---------------------------------------------------------------------------

// Receiver playout-delay bounds for one remote stream.
//
// Values are milliseconds.
//
// min_ms == 0 && max_ms == 0:
//   Request minimum possible buffering.
//
// Otherwise:
//   min_ms MUST be <= max_ms.
//
// The control applies only to the stream carrying the associated TrackId.
message PlayoutDelay {
  uint32 min_ms = 1;
  uint32 max_ms = 2;
}


// Receive options for one remote video track.
//
// Required/common video controls occupy the lowest field numbers.
//
// `playout_delay` is optional and deliberately uses field 15, the highest
// protobuf field number whose field key still encodes in one byte.
message VideoOptions {
  // Target rendered height in physical pixels.
  //
  // 0 means hidden/off-screen and permits forwarding to stop.
  uint32 height = 1;

  // Lowest useful rendered height under contention.
  //
  // 0 means fully droppable.
  uint32 min_height = 2;

  // Lowest useful frame rate under contention.
  //
  // 0 means no explicit minimum.
  uint32 min_fps = 3;

  // Relative contention priority.
  //
  // Higher values are more important.
  uint32 priority = 4;

  // Optional per-stream receiver playout-delay bounds.
  optional PlayoutDelay playout_delay = 15;
}


// Desired state for one canonical remote video track.
//
// `track_id` MUST refer to a TrackId visible in Catalog and MUST identify a
// video track.
message VideoTrackIntent {
  string track_id = 1;
  VideoOptions options = 2;
}


// Complete desired remote video state.
//
// Each entry explicitly references one canonical TrackId.
message VideoIntent {
  repeated VideoTrackIntent tracks = 1;
}


// ---------------------------------------------------------------------------
// Audio receive intent
// ---------------------------------------------------------------------------

// Receive options for one explicitly requested remote audio track.
//
// `playout_delay` uses tag 15 for the same numbering convention as
// VideoOptions.
message AudioOptions {
  optional PlayoutDelay playout_delay = 15;
}


// Desired state for one explicitly requested canonical remote audio track.
//
// `track_id` MUST refer to a TrackId visible in Catalog and MUST identify an
// audio track.
message AudioTrackIntent {
  string track_id = 1;
  AudioOptions options = 2;
}


enum AudioMode {
  // Select explicit tracks first, then automatically fill remaining negotiated
  // audio receiver capacity.
  AUDIO_MODE_AUTO = 0;

  // Select only explicit tracks. Remaining audio receivers stay unused.
  AUDIO_MODE_EXPLICIT_ONLY = 1;
}


// Complete desired remote audio state.
//
// `tracks` contains explicitly requested canonical audio TrackIds in preference
// order.
//
// In AUDIO_MODE_AUTO:
//
//   1. Available entries from `tracks` are selected first.
//   2. Remaining audio receiver capacity may be filled automatically.
//
// In AUDIO_MODE_EXPLICIT_ONLY:
//
//   Only available entries from `tracks` are selected.
//
// Per-track options apply only to explicitly listed tracks. Automatically
// selected tracks use the receiver's default playout behavior.
//
// Audio levels, speaker rank, speaking state, and selection scores are
// intentionally not exposed by this protocol.
message AudioIntent {
  repeated AudioTrackIntent tracks = 1;
  AudioMode mode = 2;
}


// ---------------------------------------------------------------------------
// Complete receive/send intent
// ---------------------------------------------------------------------------

// Complete desired remote receiving state.
//
// VideoIntent and AudioIntent are peers:
//
//   video = explicit video TrackIds with per-track receive options
//   audio = explicit audio TrackIds with per-track options plus selection policy
message ReceiveIntent {
  VideoIntent video = 1;
  AudioIntent audio = 2;
}


// Complete desired media state.
//
// Every accepted Intent atomically replaces the previous Intent.
//
// `revision` is client-owned, monotonically increasing, and scoped to this
// signaling connection. It is not an entity Id. It correlates Mapping and
// intent-specific errors.
//
// Receive intent references canonical TrackIds supplied by PulseBeam.
message Intent {
  uint64 revision = 1;
  SendIntent send = 2;
  ReceiveIntent receive = 3;
}


// ============================================================================
// 3. Mapping — where canonical remote tracks are delivered locally
// ============================================================================

// One canonical remote track assigned to one negotiated local receiver.
//
// `receiver_index` is the zero-based SDP media-section index of that receiver.
//
// It is a connection-local protocol coordinate, not a PulseBeam entity Id,
// Address, Handle, or application identity.
//
// The client resolves:
//
//   receiver_index
//       -> RTCRtpReceiver
//       -> MediaStreamTrack
//       -> TrackId
//
// `track_id` is the canonical TrackId currently delivered through that
// receiver.
message TrackMapping {
  uint32 receiver_index = 1;
  string track_id = 2;
}


// Complete current set of track mappings for one media kind.
//
// Receivers without an assigned track are omitted.
//
// Entry ordering has no semantic meaning.
message TrackMappings {
  repeated TrackMapping tracks = 1;
}


// Complete current receive mapping.
//
// Each Mapping atomically replaces the previous Mapping.
//
// `intent_revision` is the latest Intent revision accepted by the server.
//
// It is a correlation value scoped to this signaling connection, not a
// PulseBeam entity Id.
//
// Mapping changes when an actual receiver-to-TrackId assignment changes, not
// merely because audio activity, congestion, bitrate, or video layer changes.
message Mapping {
  uint64 intent_revision = 1;
  TrackMappings video = 2;
  TrackMappings audio = 3;
}


// ============================================================================
// 4. Authorization — refresh the participant JWT
// ============================================================================

// Presents a fresh customer-signed JWT for this live participant.
//
// The token MUST authorize the same canonical participant and room as the
// existing connection.
//
// The application-owned `room` and `sub` claims therefore MUST resolve to the
// same RoomId and ParticipantId.
//
// Accepted renewal extends authorization only. It does not modify SDP,
// Catalog, Intent, or Mapping.
//
// Tokens are secrets and MUST NOT be logged.
message RenewAuthorization {
  string token = 1;
}


// Current server-authoritative authorization deadline.
//
// Sent when signaling becomes ready and after an accepted renewal.
//
// Unix seconds using JWT NumericDate representation.
message Authorization {
  int64 expires_at_unix_seconds = 1;
}


// ============================================================================
// Errors
// ============================================================================

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;

  INVALID_MESSAGE = 1;
  INVALID_INTENT = 2;
  INVALID_SENDER = 3;
  INVALID_TRACK = 4;

  AUTHORIZATION_REJECTED = 5;
  AUTHORIZATION_EXPIRED = 6;

  PROTOCOL_ERROR = 7;
  INTERNAL = 8;
}


// Machine-readable protocol failure.
//
// `message` is diagnostic only and MUST NOT be parsed.
//
// `intent_revision` is present when a specific Intent was rejected.
//
// A rejected Intent never modifies the previously accepted Intent.
//
// `fatal` means safe signaling cannot continue.
message Error {
  ErrorCode code = 1;
  string message = 2;
  bool fatal = 3;
  optional uint64 intent_revision = 4;
}


// ============================================================================
// Transport
// ============================================================================

// One client-to-server signaling message.
//
// Exactly one payload is present before protobuf serialization and LZ4
// compression.
message ClientMessage {
  oneof payload {
    Intent intent = 1;
    RenewAuthorization renew_authorization = 2;
  }
}


// One server-to-client signaling message.
//
// Exactly one payload is present before protobuf serialization and LZ4
// compression.
message ServerMessage {
  oneof payload {
    Catalog catalog = 1;
    Mapping mapping = 2;
    Authorization authorization = 3;
    Error error = 4;
  }
}
