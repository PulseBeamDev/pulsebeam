syntax = "proto3";
package topic;

// All application modes share this envelope. The SFU allocates source identity
// and announces it through StateBatch. The data track's label identifies the
// topic; its delivery field selects the mode.
message TopicMessage {
  string publication_id = 1;
  uint64 sequence = 2;
  bytes payload = 3;
  TopicCaptureTimestamp captured_at = 4;
}

// Acquisition time in the clock domain bound to this publication, not ingress time.
message TopicCaptureTimestamp {
  sint64 nanoseconds = 1;
  optional uint32 uncertainty_nanoseconds = 2;
}

message TopicNack {
  string publication_id = 1;
  uint64 from_sequence = 2;
  // Server stamped; subscriber-originated frames must omit it.
  bytes requester = 3;
}

// A new subscription requests a live frontier, never retained history. An
// established subscription probes from its existing cursor after route churn.
message TopicProbe {
  string publication_id = 1;
  uint64 from_sequence = 2;
  bool live = 3;
  // Server stamped; subscriber-originated frames must omit it.
  bytes requester = 4;
}

// Establishes the starting cursor of a live subscription. It is not a message.
message TopicFrontier {
  string publication_id = 1;
  uint64 next_sequence = 2;
}

// History before available_sequence is no longer retained. An established
// receiver emits an inline gap before continuing at this sequence.
message TopicFloor {
  string publication_id = 1;
  uint64 available_sequence = 2;
}

// Advances an ordered receiver over a unit omitted from its audience.
message TopicOmission {
  string publication_id = 1;
  uint64 sequence = 2;
}

message TopicFrame {
  oneof body {
    TopicMessage message = 1;
    TopicNack nack = 2;
    TopicProbe probe = 3;
    TopicFrontier frontier = 4;
    TopicFloor floor = 5;
    TopicOmission omission = 7;
  }
  // Used only on repair output and intersected with installed subscription routes.
  bytes repair_target = 6;
  // Optional sorted, unique 16-byte connection IDs. Absent means no audience filter.
  optional bytes recipient_connections = 8;
}
