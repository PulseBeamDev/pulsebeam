[package]
name = "pulsebeam-proto"
license = "Apache-2.0"
description = "Signaling protocol over data channel"

version.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true


[lints]
workspace = true

[dependencies]
arrayvec = { version = "0.7.6", features = ["serde"], optional = true }
prost = "0.14.3"
prost-types = "0.14.3"
serde = { workspace = true, optional = true }
sha3 = { version = "0.12.0", optional = true }
thiserror = { workspace = true, optional = true }
uuid = { version = "1.23.2", features = ["v7"], optional = true }

[features]
default = []
identity = [
  "dep:arrayvec",
  "dep:serde",
  "dep:sha3",
  "dep:thiserror",
  "dep:uuid",
]

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.150"

[build-dependencies]
prost-build = "0.14.3"
