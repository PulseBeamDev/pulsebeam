[package]
name = "pulsebeam-proto"
license = "Apache-2.0"
description = "Signaling protocol over data channel"

version.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true


[lints]
workspace = true

[dependencies]
lz4_flex.workspace = true
prost = "0.14.3"
prost-types = "0.14.3"
pbjson = { version = "=0.9.0", optional = true }
serde = { workspace = true, optional = true }

[features]
default = []
json = ["dep:pbjson", "dep:serde"]

[build-dependencies]
prost = "0.14.3"
prost-types = "0.14.3"
prost-build = "0.14.3"
pbjson-build = "=0.9.0"

[dev-dependencies]
# Exercise the optional feature through Cargo's test dependency graph as well.
pulsebeam-proto = { path = ".", features = ["json"] }
serde_json = "1"
