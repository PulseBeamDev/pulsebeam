[package]
name = "pulsebeam-webrtc-sys"
version = "0.9.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
native = []

[dependencies]
cxx = "=1.0.194"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
oxitls-rustcrypto-provider = "=0.3.0"
