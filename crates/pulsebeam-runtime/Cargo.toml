[package]
name = "pulsebeam-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false


[lints]
workspace = true

[lib]

[dependencies]
axum = { version = "0.8.9", features = ["macros"], optional = true }
core_affinity = "0.8.3"
pulsebeam-tcp = { path = "../pulsebeam-tcp" }
rustix = { version = "1.1.4", features = ["param", "process", "thread", "time"] }
socket2 = "0.6.4"
thread-priority = "3.0.0"
backtrace = "0.3.76"
bytes = { workspace = true }
futures = "0.3.32"
futures-lite = { workspace = true }
libc = "0.2.186"
once_cell = "1.21.4"
parking_lot = { version = "0.12", optional = true }
pulsebeam-core = { path = "../pulsebeam-core" }
pulsebeam-queue = { path = "../pulsebeam-queue" }
pulsebeam-steer = { path = "../pulsebeam-steer", optional = true }
pulsebeam-udp = { path = "../pulsebeam-udp" }
rand = { workspace = true }
systemstat = "0.2.7"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7.18", features = ["time"] }
tracing = { workspace = true }
turmoil = { workspace = true, optional = true }
zerocopy = { version = "0.8.54", default-features = false, features = [
  "alloc",
] }
metrics = "0.24.6"

[dev-dependencies]
async-stream = "0.3.6"
criterion = { version = "0.8.2", features = ["async", "async_tokio"] }
futures-concurrency = "7.7.1"
futures-test = "0.3.32"

[features]
default = ["parking_lot"]
http = ["dep:axum"]
parking_lot = ["dep:parking_lot", "once_cell/parking_lot"]
sim = ["pulsebeam-core/sim", "pulsebeam-udp/sim", "dep:turmoil", "dep:pulsebeam-steer"]
