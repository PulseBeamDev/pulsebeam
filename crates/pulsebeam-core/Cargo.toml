[package]
name = "pulsebeam-core"
license = "Apache-2.0"
publish = false

version.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true


[lints]
workspace = true

[features]
default = []
sim = [
    "dep:turmoil",
    "dep:axum",
    "dep:futures",
]
# RTP header extension serializers. Only the str0m glue needs this; the codecs
# themselves are transport-agnostic.
str0m = ["dep:str0m"]
# Shared descriptor fixtures for downstream crates' tests.
test-utils = []

[dependencies]
tokio = { workspace = true }
futures = { version = "0.3", optional = true }
http = { version = "^1" }
arrayvec = "0.7.6"
data-encoding = "2.11.1"
data-encoding-macro = "0.1.21"
serde.workspace = true
sha3 = "0.12.0"
thiserror = { workspace = true }
uuid = { version = "1.23.2", features = ["v7"] }

axum = { version = "^0.8", optional = true }
turmoil = { workspace = true, optional = true }
reqwest = { version = "0.13.4", optional = true }
str0m = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.150"
# Exercise the feature-gated str0m glue in this crate's own test runs.
pulsebeam-core = { path = ".", features = ["str0m", "test-utils"] }
