[build]
rustc-wrapper = "sccache"
rustflags = [
  "--cfg",
  "tracing_unstable",
  "--cfg",
  "tokio_unstable",
  "-C",
  "force-frame-pointers=yes",
  # This is needed for musl
  #  "-C",
  #  "link-arg=-Wl,--allow-multiple-definition"
]

# GNU/Linux is PulseBeam's native server target. Keep mold target-scoped so
# WebAssembly and eBPF builds retain their platform linkers.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))']
linker = "clang"
rustflags = [
  "--cfg",
  "tracing_unstable",
  "--cfg",
  "tokio_unstable",
  "-C",
  "force-frame-pointers=yes",
  "-C",
  "link-arg=-fuse-ld=mold",
]

# [unstable]
# codegen-backend = true
#
# [profile.dev]
# codegen-backend = "cranelift"

[env]
CFLAGS = "-fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
CXXFLAGS = "-fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
