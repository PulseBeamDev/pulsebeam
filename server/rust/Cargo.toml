[package]
name = "pulsebeam-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Native server-side PulseBeam participant token signing"
repository = "https://github.com/PulseBeamDev/pulsebeam"
homepage = "https://pulsebeam.dev/"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "Cargo.toml", "vendor/**"]

[dependencies]
data-encoding = "2.11.1"
pulsebeam-auth = { version = "0.1.0", path = "../../crates/pulsebeam-auth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0"
uuid = "1.23.2"
