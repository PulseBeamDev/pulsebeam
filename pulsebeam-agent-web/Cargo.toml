[package]
name = "pulsebeam-agent-web"
license = "Apache-2.0"
publish = false
version.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
pulsebeam-agent-core = { path = "../pulsebeam-agent-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.85"
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
web-sys = { version = "0.3.85", features = [
    "Blob",
    "Headers",
    "MessageChannel",
    "MessageEvent",
    "MessagePort",
    "Performance",
    "Request",
    "RequestInit",
    "Response",
    "Url",
    "Worker",
    "Window",
] }

[dev-dependencies]
futures-lite = { workspace = true }
pulsebeam-proto = { path = "../pulsebeam-proto" }
