[package]
name = "pulsebeam-agent-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
agent_core = { package = "pulsebeam-agent-core", version = "0.1.0", path = "../pulsebeam-agent-core" }
gloo-net = "0.6"
gloo-timers = "0.3"
js-sys = "0.3"
log = { version = "0.4", default-features = false }
thiserror = "2.0"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.104", features = [
  "AbortController",
  "AbortSignal",
  "Event",
  "EventTarget",
  "MessageEvent",
  "MediaStreamTrack",
  "Performance",
  "RtcDataChannel",
  "RtcDataChannelInit",
  "RtcDataChannelState",
  "RtcPeerConnection",
  "RtcPeerConnectionState",
  "RtcRtpTransceiver",
  "RtcRtpSender",
  "RtcTrackEvent",
  "RtcRtpTransceiverDirection",
  "RtcRtpTransceiverInit",
  "RtcSessionDescriptionInit",
  "RtcSdpType",
  "Window",
  "console",
] }
